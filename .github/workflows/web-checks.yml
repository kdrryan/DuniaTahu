name: Ratio Web Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: https://duniatahu-api.christainmichael22.workers.dev
