name: Build DuniaTahu APK

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versi release, contoh v1.2.3. Kosongkan jika hanya ingin build APK."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: https://duniatahu-api.christainmichael22.workers.dev

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/duniatahu-release.jks"

      - name: Build signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/duniatahu-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuniaTahu-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release and upload APK
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: DuniaTahu ${{ inputs.release_tag }}
          body: "DuniaTahu Android release."
          files: android/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
